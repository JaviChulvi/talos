# No listener is published on the host. Only native agent bridges join this service.
http_port 3128
visible_hostname talos-egress
pid_filename none
pinger_enable off
access_log none
cache_log /dev/stderr
cache_store_log none
cache deny all
coredump_dir /tmp

acl web_ports port 80 443
acl tls_port port 443
acl CONNECT method CONNECT
# Resolve destination names here, then deny non-public destinations before forwarding.
acl private_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8 2001:db8::/32 ::ffff:0:0/96
http_access deny !web_ports
http_access deny CONNECT !tls_port
http_access deny private_dst
http_access allow all
