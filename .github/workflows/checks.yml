name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m 'not integration'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint && pnpm --dir frontend typecheck && pnpm --dir frontend build
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build api
      - run: docker compose up -d --no-build
      - name: Verify startup and database persistence
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health/ready
          docker compose exec -T db psql -U talos -d talos -Atc 'select version_num from alembic_version' > /tmp/schema-before
          docker compose restart db
          for attempt in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U talos -d talos; then break; fi
            sleep 2
          done
          docker compose exec -T db psql -U talos -d talos -Atc 'select version_num from alembic_version' > /tmp/schema-after
          cmp /tmp/schema-before /tmp/schema-after
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down --volumes
