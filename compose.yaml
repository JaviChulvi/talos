name: talos
x-platform: &platform
  build:
    context: .
    dockerfile: deploy/Dockerfile
    target: platform
  image: talos-platform:local
  environment: &environment
    TALOS_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-talos}
    TALOS_INFERENCE_TIMEOUT_SECONDS: ${TALOS_INFERENCE_TIMEOUT_SECONDS:-1800}
    TALOS_INFERENCE_IDLE_TIMEOUT_SECONDS: ${TALOS_INFERENCE_IDLE_TIMEOUT_SECONDS:-300}
    TALOS_INFERENCE_MAX_OUTPUT_CHARS: ${TALOS_INFERENCE_MAX_OUTPUT_CHARS:-4000000}
    TALOS_INFERENCE_MAX_REQUEST_BYTES: ${TALOS_INFERENCE_MAX_REQUEST_BYTES:-16777216}
    TALOS_INSTALLATION_ID: ${TALOS_INSTALLATION_ID:-local}
    TALOS_DATABASE_URL: postgresql+psycopg://talos@db:5432/talos
    TALOS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
  networks: [control]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  native-runtime:
    profiles: [build]
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: native-runtime
    image: talos-openclaw-native:local
  hermes-runtime:
    profiles: [build]
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: hermes-runtime
    image: talos-hermes-native:local
  egress:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: egress
    image: talos-egress:local
    restart: unless-stopped
    labels:
      io.talos.installation: ${TALOS_INSTALLATION_ID:-local}
    networks: [egress]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
  db:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_DB: talos
      POSTGRES_USER: talos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talos -d talos"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *platform
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *platform
    networks: [control, ingress]
    volumes: ["provider-secrets:/var/lib/talos-provider", "setup-artifacts:/var/lib/talos-setups"]
    ports: ["127.0.0.1:${TALOS_PORT:-8000}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    <<: *platform
    restart: unless-stopped
    labels:
      io.talos.installation: ${TALOS_INSTALLATION_ID:-local}
    user: "0:10001"
    command: ["python", "-m", "worker.main"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock", "worker-state:/var/lib/talos", "setup-artifacts:/var/lib/talos-setups"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  gateway:
    <<: *platform
    networks: [control, inference-egress]
    volumes: ["provider-secrets:/var/lib/talos-provider:ro"]
    labels:
      io.talos.installation: ${TALOS_INSTALLATION_ID:-local}
    command: ["uvicorn", "gateway.main:app", "--host", "0.0.0.0", "--port", "8001", "--no-proxy-headers"]
    depends_on:
      migrate: {condition: service_completed_successfully}
networks:
  inference-egress:
  egress:
  ingress:
  control:
    internal: true
volumes:
  setup-artifacts:
  provider-secrets:
  postgres-data:
  worker-state:
