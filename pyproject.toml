[project]
name = "talos"
version = "0.1.0"
description = "Self-hosted platform for managing AI agents, their tools, access, and usage"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
authors = [{name = "Javier Chulvi Bernad"}]
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "docker>=7.1,<8",
  "websockets>=15,<16",
  "cryptography>=45,<51",
  "httpx>=0.28,<1",
  "pyyaml>=6,<7",
  "slack-sdk>=3.41,<4",
  "aiohttp>=3.12,<4",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "worker", "gateway", "connector"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL or Docker"]
